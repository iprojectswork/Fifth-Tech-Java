# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/**/*.xml

spring:
  application:
    name: demo
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 0
      timeout: 3000ms
  sql:
    init:
      dependency-check: false

server:
  port: 8080

auth:
  token:
    header: Authorization
    prefix: "Bearer "
    expiration: 86400
    white-list: /auth/login

cache:
  admin:
    max-scan-keys: 5000
    max-value-bytes: 262144

# C2 业务编码 / 号段池
code:
  generate:
    # 单次 generate API 最多取多少个号（含 count 字段上限）
    max-batch-count: 100
    # 规则未显式配置 batch_size 时的默认
    default-pool-batch-size: 100
    # 号段池锁：等待 + 租约（秒）。Redisson 看门狗可续约，留 lease 兜底。
    lock-wait-seconds: 5
    lock-lease-seconds: 30
  # 业务时间默认时区；DATE 片段按时区解析
  timezone: Asia/Shanghai

logging:
  level:
    com.baomidou.mybatisplus: DEBUG
    org.mybatis: DEBUG


#debug: true
